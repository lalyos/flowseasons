<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Flow Seasons 2026 — Admin</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/xxxadmin.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Flow Seasons — Admin</h1>
        <p>Az admin döntések csak a Total eredményt módosítják, a forráseredményeket nem.</p>
      </header>
      <nav class="admin-tabs" aria-label="Admin nézetek">
        <a id="categories-tab" href="#categories" aria-controls="categories-panel">Category change</a>
        <a id="multi-registration-tab" href="#multi-registration" aria-controls="multi-registration-panel">multi-reg</a>
      </nav>
      <p id="admin-warning" class="message" role="status"></p>
      <section id="categories-panel" aria-labelledby="categories-tab">
        <label class="admin-filter">Sportoló keresése
          <input id="category-search" type="search" placeholder="Név, Flow ID vagy VL ID" />
        </label>
        <label class="admin-filter">Szűrés
          <select id="category-filter">
            <option value="">mind</option>
            <option value="category_change">kategóriaváltás — azonos VL ID</option>
            <option value="assignment_mismatch">assignment mismatch</option>
          </select>
        </label>
        <p id="category-status" class="message" role="status" aria-live="polite"></p>
        <section id="category-candidates" class="admin-candidates" aria-label="Éves kategóriák"></section>
      </section>
      <section id="multi-registration-panel" aria-labelledby="multi-registration-tab" hidden>
        <button id="refresh-candidates" class="admin-save" type="button">Refresh candidates</button>
        <p>Új vagy frissített eredmény feltöltése után frissítsd a jelölteket. Ez nem módosítja az összerendeléseket vagy a pontokat.</p>
        <label class="admin-filter">Sportoló keresése
          <input id="review-search" type="search" placeholder="Név, Flow ID vagy VL ID" />
        </label>
        <label class="admin-filter">Szűrés
          <select id="review-filter">
            <option value="">mind</option>
            <option value="to_decide">to-decide</option>
            <option value="potential_match">potential match</option>
            <option value="same_event_collision">same-event collision</option>
            <option value="overlapping_event">overlapping event — külön Flow ID-k is</option>
            <option value="score_disparity">2× score difference</option>
            <option value="top_ten">top-10 impact</option>
            <option value="merged">merged</option>
            <option value="kept_separate">kept separate</option>
          </select>
        </label>
        <p id="review-status" class="message" role="status" aria-live="polite"></p>
        <section id="review-candidates" class="admin-candidates" aria-label="Regisztrációk áttekintése"></section>
      </section>
    </main>
  </body>
</html>
